<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Music Player</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 16px; margin: 0 auto; max-width: 480px; padding-bottom: 135px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; }
        .card { min-width: 110px; cursor: pointer; }
        .cover { width: 110px; height: 110px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; background: #1e1e1e; margin-bottom: 8px; }
        .track.active { border: 1px solid #1db954; color: #1db954; }
        .t-img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #2c2c2c; flex-shrink: 0; }
        
        .player-bar { position: fixed; bottom: 10px; left: 10px; right: 10px; max-width: 460px; margin: 0 auto; background: #242424; padding: 10px 14px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100; }
        .mini-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; cursor: pointer; }
        .mini-img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: #333; }
        .now-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .progress-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #aaa; margin-bottom: 6px; }
        .progress-row input[type=range] { flex: 1; accent-color: #1db954; height: 4px; cursor: pointer; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; position: relative; }
        .main-btns { display: flex; align-items: center; gap: 14px; margin: 0 auto; }
        .icon-btn { background: none; color: #fff; font-size: 20px; padding: 6px; border: none; cursor: pointer; }
        .play-main { background: #1db954; color: #000; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-weight: bold; }
        
        /* Полноэкранный плеер с большой обложкой */
        .full-screen { display: none; position: fixed; inset: 0; background: linear-gradient(180deg, #2b2b2b 0%, #121212 100%); z-index: 500; flex-direction: column; padding: 20px; align-items: center; justify-content: space-between; }
        .full-screen.open { display: flex; }
        .big-cover { width: 100%; max-width: 310px; aspect-ratio: 1/1; border-radius: 16px; object-fit: cover; box-shadow: 0 16px 40px rgba(0,0,0,0.7); background: #222; }
        
        .vol-popup { display: none; position: absolute; right: 0; bottom: 48px; background: #333; padding: 10px 12px; border-radius: 10px; align-items: center; gap: 8px; }
        .vol-popup.open { display: flex; }
        .vol-popup input[type=range] { width: 90px; accent-color: #1db954; }
        .btn-green { background: #1db954; color: #000; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .yt-box { display: none; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 16px; border-radius: 10px; overflow: hidden; background: #000; }
        .yt-box iframe { width: 100%; height: 100%; border: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #1e1e1e; padding: 20px; border-radius: 14px; width: 100%; max-width: 400px; }
        .modal-card input { width: 100%; padding: 10px; margin: 8px 0 14px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2 style="margin:0;">Моя медиатека</h2>
        <button class="btn-green" onclick="openModal()">➕ Видео</button>
    </div>

    <div class="row" id="playlists"></div>
    <div class="yt-box" id="yt-container"><iframe id="yt-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="pl-title" style="margin:0;">Все треки</h3>
        <button class="btn-green" onclick="shufflePlay()">🔀 Перемешать</button>
    </div>
    <div id="tracks"></div>

    <!-- Нижний плеер (клик по названию/обложке разворачивает на весь экран) -->
    <div class="player-bar">
        <div class="mini-top" onclick="openFull()">
            <img id="mini-cover" class="mini-img" src="">
            <div class="now-title" id="now-playing">Выбери трек</div>
            <span style="color:#888; font-size:18px;">⌃</span>
        </div>
        <div class="progress-row">
            <span id="time-cur">0:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100" oninput="seekAudio()">
            <span id="time-dur">0:00</span>
        </div>
        <div class="controls-row">
            <div style="width:32px;"></div>
            <div class="main-btns">
                <button class="icon-btn" onclick="prevTrack()">⏮</button>
                <button class="play-main" onclick="togglePlay()" id="play-btn">▶</button>
                <button class="icon-btn" onclick="nextTrack()">⏭</button>
            </div>
            <button class="icon-btn" onclick="toggleVolPopup()" id="vol-btn">🔊</button>
            <div class="vol-popup" id="vol-popup">
                <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
            </div>
        </div>
    </div>

    <!-- Полноэкранный режим с большой обложкой -->
    <div class="full-screen" id="full-screen">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <button class="icon-btn" onclick="closeFull()" style="font-size:26px;">⌄</button>
            <span style="font-size:12px; color:#aaa; letter-spacing:1px;">СЕЙЧАС ИГРАЕТ</span>
            <div style="width:26px;"></div>
        </div>
        <img id="big-cover" class="big-cover" src="">
        <div style="text-align:center; width:100%;">
            <h2 id="big-title" style="margin:0 0 6px; font-size:20px;">Название трека</h2>
            <p id="big-artist" style="margin:0; color:#aaa; font-size:14px;">Плейлист</p>
        </div>
        <div style="display:flex; align-items:center; gap:24px; margin-bottom:20px;">
            <button class="icon-btn" onclick="prevTrack()" style="font-size:28px;">⏮</button>
            <button class="play-main" onclick="togglePlay()" id="big-play-btn" style="width:60px; height:60px; font-size:24px;">▶</button>
            <button class="icon-btn" onclick="nextTrack()" style="font-size:28px;">⏭</button>
        </div>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-card">
            <h3 style="margin-top:0;">Добавить YouTube видео</h3>
            <input type="text" id="yt-url-input" placeholder="Вставь ссылку с YouTube...">
            <input type="text" id="yt-title-input" placeholder="Название для списка">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn-green" style="background:#333; color:#fff;" onclick="closeModal()">Отмена</button>
                <button class="btn-green" onclick="saveYtVideo()">Добавить</button>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>
    <script src="tracks.js"></script>
    <script src="app.js?v=5"></script>
</body>
</html>
