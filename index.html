<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Music Player</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 16px; margin: 0 auto; max-width: 480px; padding-bottom: 80px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; }
        .card { min-width: 110px; cursor: pointer; }
        .cover { width: 110px; height: 110px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .track { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer; background: #1e1e1e; margin-bottom: 8px; }
        .track.active { border: 1px solid #1db954; color: #1db954; }
        .del-btn { background: none; color: #777; font-size: 16px; padding: 4px 8px; }
        .bar { position: fixed; bottom: 10px; left: 10px; right: 10px; max-width: 460px; margin: 0 auto; background: #282828; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #1db954; color: #000; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .yt-box { display: none; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 16px; border-radius: 10px; overflow: hidden; background: #000; }
        .yt-box iframe { width: 100%; height: 100%; border: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #1e1e1e; padding: 20px; border-radius: 14px; width: 100%; max-width: 400px; }
        .modal-card input { width: 100%; padding: 10px; margin: 8px 0 14px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2 style="margin:0;">Моя медиатека</h2>
        <button onclick="openModal()">➕ Видео</button>
    </div>

    <div class="row" id="playlists"></div>
    
    <div class="yt-box" id="yt-container">
        <iframe id="yt-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="pl-title" style="margin:0;">Все треки</h3>
        <button onclick="shufflePlay()">🔀 Перемешать</button>
    </div>
    <div id="tracks"></div>

    <div class="bar">
        <span id="now-playing" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:65%;">Выбери трек</span>
        <div>
            <button onclick="togglePlay()" id="play-btn">▶</button>
            <button onclick="nextTrack()">⏭</button>
        </div>
    </div>

    <!-- Окно добавления видео -->
    <div class="modal" id="add-modal">
        <div class="modal-card">
            <h3 style="margin-top:0;">Добавить YouTube видео</h3>
            <label>Ссылка на ролик:</label>
            <input type="text" id="yt-url-input" placeholder="Вставь ссылку с YouTube...">
            <label>Название для списка:</label>
            <input type="text" id="yt-title-input" placeholder="Например: Ночной мейдкор микс">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button style="background:#333; color:#fff;" onclick="closeModal()">Отмена</button>
                <button onclick="saveYtVideo()">Добавить</button>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>
    <script src="tracks.js"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
