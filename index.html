<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FXMusic Player</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-bar: #242424;
            --accent: #1db954;
            --text-main: #ffffff;
            --text-sub: #a7a7a7;
            --border: #2c2c2c;
        }
        body.amoled-theme {
            --bg-body: #000000;
            --bg-card: #0e0e0e;
            --bg-bar: #141414;
            --accent: #6c8cff;
            --text-main: #f5f5f5;
            --text-sub: #888888;
            --border: #1f1f1f;
        }
        body { background: var(--bg-body); color: var(--text-main); font-family: sans-serif; padding: 16px; margin: 0 auto; max-width: 480px; padding-bottom: 135px; transition: background 0.2s; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .top-btns { display: flex; gap: 8px; }
        .search-box { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 14px; margin-bottom: 14px; box-sizing: border-box; outline: none; }
        .search-box:focus { border-color: var(--accent); }
        
        .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 14px; }
        .card { min-width: 105px; cursor: pointer; }
        .cover { width: 105px; height: 105px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
        
        .track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; background: var(--bg-card); margin-bottom: 8px; border: 1px solid transparent; }
        .track.active { border-color: var(--accent); color: var(--accent); }
        .t-img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #2c2c2c; flex-shrink: 0; }
        
        .player-bar { position: fixed; bottom: 10px; left: 10px; right: 10px; max-width: 460px; margin: 0 auto; background: var(--bg-bar); padding: 10px 14px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.7); z-index: 100; border: 1px solid var(--border); }
        .mini-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; cursor: pointer; }
        .mini-img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: #333; }
        .now-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .progress-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .progress-row input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; position: relative; }
        .main-btns { display: flex; align-items: center; gap: 14px; margin: 0 auto; }
        .icon-btn { background: none; color: var(--text-main); font-size: 20px; padding: 6px; border: none; cursor: pointer; }
        .icon-btn.active { color: var(--accent); }
        .play-main { background: var(--accent); color: #000; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-weight: bold; }
        
        /* Полноэкранный плеер */
        .full-screen { display: none; position: fixed; inset: 0; background: linear-gradient(180deg, var(--bg-bar) 0%, var(--bg-body) 100%); z-index: 500; flex-direction: column; padding: 20px 24px 30px; align-items: center; justify-content: space-between; }
        .full-screen.open { display: flex; }
        .big-cover { width: 100%; max-width: 300px; aspect-ratio: 1/1; border-radius: 16px; object-fit: cover; box-shadow: 0 16px 40px rgba(0,0,0,0.7); background: #222; }
        .fp-controls { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .vol-popup { display: none; position: absolute; right: 0; bottom: 48px; background: var(--bg-card); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; align-items: center; gap: 8px; }
        .vol-popup.open { display: flex; }
        .vol-popup input[type=range] { width: 90px; accent-color: var(--accent); }
        .btn-accent { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-dark { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        
        .yt-box { display: none; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 16px; border-radius: 10px; overflow: hidden; background: #000; }
        .yt-box iframe { width: 100%; height: 100%; border: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 14px; width: 100%; max-width: 400px; }
        .modal-card input { width: 100%; padding: 10px; margin: 8px 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2 style="margin:0;">Медиатека</h2>
        <div class="top-btns">
            <button class="btn-dark" onclick="openSettings()">⚙️</button>
            <button class="btn-dark" onclick="openNoteModal()">📝 Заметка</button>
            <button class="btn-accent" onclick="openModal()">➕ Видео</button>
        </div>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 Поиск по трекам..." oninput="searchTracks()">

    <div class="row" id="playlists"></div>
    <div class="yt-box" id="yt-container"><iframe id="yt-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="pl-title" style="margin:0;">Все треки</h3>
        <button class="btn-accent" onclick="shuffleQueue()">🔀 Перемешать</button>
    </div>
    <div id="tracks"></div>

    <!-- Мини-плеер -->
    <div class="player-bar">
        <div class="mini-top" onclick="openFull()">
            <img id="mini-cover" class="mini-img" src="">
            <div class="now-title" id="now-playing">Выбери трек</div>
            <span style="color:var(--text-sub); font-size:18px;">⌃</span>
        </div>
        <div class="progress-row">
            <span id="time-cur">0:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
            <span id="time-dur">0:00</span>
        </div>
        <div class="controls-row">
            <button class="icon-btn" onclick="toggleRepeat()" id="mini-rep-btn" style="font-size:16px;">🔁</button>
            <div class="main-btns">
                <button class="icon-btn" onclick="prevTrack()">⏮</button>
                <button class="play-main" onclick="togglePlay()" id="play-btn">▶</button>
                <button class="icon-btn" onclick="nextTrack()">⏭</button>
            </div>
            <button class="icon-btn" onclick="toggleVolPopup()" id="vol-btn">🔊</button>
            <div class="vol-popup" id="vol-popup">
                <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
            </div>
        </div>
    </div>

    <!-- Полноэкранный режим с таймфреймом и повтором -->
    <div class="full-screen" id="full-screen">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
            <button class="icon-btn" onclick="closeFull()" style="font-size:26px;">⌄</button>
            <span style="font-size:12px; color:var(--text-sub); letter-spacing:1px;">СЕЙЧАС ИГРАЕТ</span>
            <div style="width:26px;"></div>
        </div>
        <img id="big-cover" class="big-cover" src="">
        <div style="text-align:center; width:100%;">
            <h2 id="big-title" style="margin:0 0 6px; font-size:20px;">Название трека</h2>
            <p id="big-artist" style="margin:0; color:var(--text-sub); font-size:14px;">Плейлист</p>
        </div>
        
        <div style="width:100%;">
            <div class="progress-row" style="margin-bottom:18px;">
                <span id="big-time-cur">0:00</span>
                <input type="range" id="big-seek-bar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
                <span id="big-time-dur">0:00</span>
            </div>
            <div class="fp-controls">
                <button class="icon-btn" onclick="shuffleQueue()" title="Перемешать очередь">🔀</button>
                <button class="icon-btn" onclick="prevTrack()" style="font-size:28px;">⏮</button>
                <button class="play-main" onclick="togglePlay()" id="big-play-btn" style="width:62px; height:62px; font-size:24px;">▶</button>
                <button class="icon-btn" onclick="nextTrack()" style="font-size:28px;">⏭</button>
                <button class="icon-btn" onclick="toggleRepeat()" id="big-rep-btn">🔁</button>
            </div>
        </div>
    </div>

    <!-- Модалка настроек -->
    <div class="modal" id="settings-modal">
               <div class="modal-card">
            <h3 style="margin-top:0;">Настройки плеера</h3>
            <p style="color:var(--text-sub); font-size:14px; margin-bottom:10px;">Оформление интерфейса:</p>
            <div style="display:flex; gap:10px; margin-bottom:16px;">
                <button class="btn-dark" style="flex:1;" onclick="setTheme('default')">🌑 Стандартная</button>
                <button class="btn-dark" style="flex:1;" onclick="setTheme('amoled')">🖤 Тёмная (AMOLED)</button>
            </div>

            <p style="color:var(--text-sub); font-size:14px; margin-bottom:10px;">Перенос видео (ПК ↔ Телефон):</p>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn-dark" style="flex:1;" onclick="exportData()">📤 Копировать</button>
                <button class="btn-dark" style="flex:1;" onclick="importData()">📥 Вставить</button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; color:var(--text-sub);">Версия: v=14</span>
                <button class="btn-accent" onclick="closeSettings()">Готово</button>
            </div>
        </div>


    <div class="modal" id="add-modal">
        <div class="modal-card">
            <h3 style="margin-top:0;">Добавить ВК Видео</h3>
            <input type="text" id="yt-url-input" placeholder="Вставь ссылку из ВК Видео">
            <input type="text" id="yt-title-input" placeholder="Название для списка">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn-dark" onclick="closeModal()">Отмена</button>
                <button class="btn-accent" onclick="saveYtVideo()">Добавить</button>
            </div>
        </div>
    </div>
        
<div class="modal" id="note-modal">
    <div class="modal-card">
        <h3 style="margin-top:0;">Новая карточка / Заметка</h3>
        <input type="text" id="note-name" placeholder="Артист или название трека...">
        <input type="text" id="note-tag" placeholder="Жанр или пометка (например: на будущее, мейдкор)">
        <input type="text" id="note-link" placeholder="Ссылка на ВК, ТГ или YouTube (необязательно)">
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn-dark" onclick="closeNoteModal()">Отмена</button>
            <button class="btn-accent" onclick="saveNote()">Сохранить</button>
        </div>
    </div>
</div>

    <div id="err-box" style="display:none; background:#600; color:#fff; padding:10px; border-radius:8px; margin:12px 0; font-size:12px;"></div>
    <script>
        
        };
    </script>

            <div id="err-box" style="display:none; background:#600; color:#fff; padding:10px; border-radius:8px; margin:12px 0; font-size:12px; position:relative;">
        <span id="err-text"></span>
        <button onclick="document.getElementById('err-box').style.display='none'" style="position:absolute; right:8px; top:6px; background:none; border:none; color:#fff; font-weight:bold; cursor:pointer;">✖</button>
    </div>
    <script>
        window.onerror = function(msg, url, line) {
            if (msg === 'Script error.' && line === 0) return;
            document.getElementById('err-box').style.display = 'block';
            document.getElementById('err-text').innerText = 'Ошибка: ' + msg + ' (строка ' + line + ')';
        };
    </script>

    <audio id="audio"></audio>
      <div id="err-box" style="display:none; background:#600; color:#fff; padding:10px; border-radius:8px; margin:12px 0; font-size:12px;"></div>
    <script>
        window.onerror = function(msg, url, line) {
            var b = document.getElementById('err-box');
            b.style.display = 'block';
            b.innerText = 'Ошибка: ' + msg + ' (строка ' + line + ')';
        };
    </script>
    <audio id="audio"></audio>
    <script src="tracks.js"></script>
    <script src="app.js?v=20"></script>
</body>
</html>
